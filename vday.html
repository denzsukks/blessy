<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Valentines 💙</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  background: radial-gradient(circle at top, rgba(20,40,80,0.9), #020b1a);
  font-family: 'Segoe UI', sans-serif;
  color:white;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 40px 20px;
}

/* CARD */
.card {
  background: rgba(20,40,80,0.4);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  padding: 25px;
  margin-bottom: 50px;
  box-shadow: 0 0 25px rgba(0,150,255,0.4),
              0 0 60px rgba(0,150,255,0.2);
}

/* TITLE CARD */
.title {
  text-align:center;
}
.title h1 {
  font-size:2rem;
}
.title p {
  margin-top:15px;
}

/* VIDEO PLAYER */
.video-wrapper video {
  width:100%;
  border-radius:15px;
  background:black;
}

.playlist {
  margin-top:20px;
}

.playlist div {
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,0.2);
  cursor:pointer;
}

.playlist div:hover {
  background: rgba(0,150,255,0.2);
}

/* STORY PORTRAIT */
.story-container {
  display:flex;
  justify-content:center;
}

.story-card {
  position: relative;
  width: 260px;
  height: 460px; /* PORTRAIT MODE */
  border-radius:20px;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(0,150,255,0.6);
}

.story-card img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.story-progress {
  display:flex;
  gap:4px;
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
}

.story-progress div {
  flex:1;
  height:4px;
  background: rgba(255,255,255,0.3);
}

.story-progress span {
  display:block;
  height:100%;
  width:0%;
  background:white;
}

.story-tap {
  position:absolute;
  top:0;
  bottom:0;
  width:50%;
}

.story-tap.left { left:0; }
.story-tap.right { right:0; }

/* Hearts */
.heart {
  position: fixed;
  bottom:-20px;
  font-size:18px;
  color:#66b2ff;
  animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
  from { transform:translateY(0); opacity:1; }
  to { transform:translateY(-100vh); opacity:0; }
}
</style>
</head>

<body>

<audio id="bgMusic" autoplay loop>
  <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<div class="container">

  <!-- CARD 1 -->
  <div class="card title">
    <h1>HAPPY VALENTINES MY ONE OF ONE 💙</h1>
    <p>
      Even though distance separates us, my heart is always with you.  
      This is my little digital hug for you 🫶
    </p>
  </div>

  <!-- CARD 2 VIDEO -->
  <div class="card">
    <h2>🎥 Our Videos</h2>
    <div class="video-wrapper">
      <video id="videoPlayer" controls></video>
    </div>

    <div class="playlist">
      <div onclick="playVideo('assets/videos/v1.mp4')">💙 Video 1</div>
      <div onclick="playVideo('assets/videos/v2.mp4')">💙 Video 2</div>
      <div onclick="playVideo('assets/videos/v3.mp4')">💙 Video 3</div>
      <div onclick="playVideo('assets/videos/v4.mp4')">💙 Video 4</div>
    </div>
  </div>

  <!-- CARD 3 STORY -->
  <div class="card">
    <h2>📸 Our Memories</h2>

    <div class="story-container">
      <div class="story-card" id="storyCard">
        <div class="story-progress" id="storyProgress"></div>
        <img id="storyImg">
        <div class="story-tap left" onclick="prevStory()"></div>
        <div class="story-tap right" onclick="nextStory()"></div>
      </div>
    </div>
  </div>

</div>

<script>
/* MUSIC CONTROL */
const bgMusic = document.getElementById("bgMusic");
const videoPlayer = document.getElementById("videoPlayer");

videoPlayer.addEventListener("play", ()=> bgMusic.pause());
videoPlayer.addEventListener("pause", ()=> bgMusic.play());
videoPlayer.addEventListener("ended", ()=> bgMusic.play());

function playVideo(src){
  videoPlayer.src = src;
  videoPlayer.play();
}

/* STORY */
const storyImages = [
  "assets/story/1.jpg",
  "assets/story/2.jpg",
  "assets/story/3.jpg",
  "assets/story/4.jpg",
  "assets/story/5.jpg",
  "assets/story/6.jpg"
];

let storyIndex = 0;
let storyTimer;
const storyDuration = 4000;

const storyImg = document.getElementById("storyImg");
const storyProgress = document.getElementById("storyProgress");

storyImages.forEach(()=>{
  const bar = document.createElement("div");
  bar.innerHTML = "<span></span>";
  storyProgress.appendChild(bar);
});

function showStory(){
  clearInterval(storyTimer);
  storyImg.src = storyImages[storyIndex];
  animateStoryProgress(storyIndex);
  storyTimer = setTimeout(nextStory, storyDuration);
}

function animateStoryProgress(i){
  const spans = document.querySelectorAll(".story-progress span");
  spans.forEach(s=>s.style.width="0%");
  let w=0;
  const interval=setInterval(()=>{
    if(w>=100) clearInterval(interval);
    else{
      w++;
      spans[i].style.width=w+"%";
    }
  },storyDuration/100);
}

function nextStory(){
  storyIndex++;
  if(storyIndex>=storyImages.length) storyIndex=0;
  showStory();
}

function prevStory(){
  storyIndex--;
  if(storyIndex<0) storyIndex=storyImages.length-1;
  showStory();
}

showStory();

/* HEARTS */
function createHeart(){
  const h=document.createElement("div");
  h.className="heart";
  h.textContent="❤";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(3+Math.random()*3)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
}
setInterval(createHeart,800);
</script>

</body>
</html>
