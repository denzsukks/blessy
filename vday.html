<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Valentines 💙</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  background: radial-gradient(circle at top, rgba(20,40,80,0.85), #020b1a);
  font-family: 'Segoe UI', sans-serif;
  color:white;
}

/* FULLSCREEN ENVELOPE */
#envelope {
  position: fixed;
  inset: 0;
  background: #020b1a;
  z-index: 9999;
  overflow: hidden;
}

.envelope {
  width: 100%;
  height: 100%;
  background: #123c7a;
  animation: openEnvelope 2.5s forwards ease-in-out;
}

@keyframes openEnvelope {
  0%   { clip-path: inset(0 0 0 0); }
  100% { clip-path: inset(0 0 100% 0); }
}

/* TYPE TEXT */
.type-text {
  font-family: 'Pacifico', cursive;
  font-size:2.5rem;
  text-align:center;
}

/* CARD */
.card {
  background: rgba(20,40,80,0.4);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  padding: 25px;
  margin: 160px auto;
  max-width: 1000px;
  box-shadow: 0 0 25px rgba(0,150,255,0.5),
              0 0 60px rgba(0,150,255,0.2);
}

/* VIDEO */
.video-layout {
  display:flex;
  align-items:center;
}

.video-wrapper {
  width:650px;
  height:360px;
}

video {
  width:100%;
  height:100%;
  border-radius:15px;
  background:black;
}

.playlist {
  display:flex;
  flex-direction:column;
  margin-left:8px;
}

.playlist div {
  font-size:1.4rem;
  padding:12px;
  cursor:pointer;
}

/* STORY SECTION */
.story-section {
  display:flex;
  align-items:center;
  gap:30px;
  margin:160px auto;
  max-width:1000px;
}

.story-card {
  width:260px;
  height:460px;
  border-radius:20px;
  overflow:hidden;
  position:relative;
  box-shadow:0 0 25px rgba(0,150,255,0.6);
}

.story-card img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.message-card {
  width:360px;
  height:460px;
  background: rgba(20,40,80,0.4);
  padding:25px;
  border-radius:20px;
  box-shadow:0 0 25px rgba(0,150,255,0.4);
}

.story-progress {
  display:flex;
  gap:4px;
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
}

.story-progress div {
  flex:1;
  height:4px;
  background:rgba(255,255,255,0.3);
}

.story-progress span {
  display:block;
  height:100%;
  width:0%;
  background:white;
}

.story-tap {
  position:absolute;
  top:0;
  bottom:0;
  width:50%;
}

.story-tap.left { left:0; }
.story-tap.right { right:0; }

/* HEARTS */
.heart {
  position:fixed;
  bottom:-20px;
  font-size:18px;
  color:#66b2ff;
  animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
  from { transform:translateY(0); opacity:1; }
  to { transform:translateY(-100vh); opacity:0; }
}
</style>
</head>

<body>

<div id="envelope">
  <div class="envelope"></div>
</div>

<audio id="bgMusic" autoplay loop>
  <source src="assets/kahel.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <div class="type-text" id="typeText"></div>
</div>

<div class="card">
  <div class="video-layout">
    <div class="video-wrapper">
      <video id="videoPlayer"></video>
    </div>
    <div class="playlist">
      <div onclick="playVideo('assets/videos/v1.mp4')">📹</div>
      <div onclick="playVideo('assets/videos/v2.mp4')">📹</div>
      <div onclick="playVideo('assets/videos/v3.mp4')">📹</div>
      <div onclick="playVideo('assets/videos/v4.mp4')">📹</div>
    </div>
  </div>
</div>

<!-- STORY 1 -->
<div class="story-section">
  <div class="story-card">
    <div class="story-progress" id="prog1"></div>
    <img id="story1">
    <div class="story-tap left" onclick="prevStory(1)"></div>
    <div class="story-tap right" onclick="nextStory(1)"></div>
  </div>

  <div class="message-card">
    <h2>💌 My Love</h2>
    <p>You are my favorite notification. My safe place. My person.</p>
  </div>
</div>

<!-- STORY 2 -->
<div class="story-section">
  <div class="message-card">
    <h2>💖 Always</h2>
    <p>No matter what happens, I will always choose you.</p>
  </div>

  <div class="story-card">
    <div class="story-progress" id="prog2"></div>
    <img id="story2">
    <div class="story-tap left" onclick="prevStory(2)"></div>
    <div class="story-tap right" onclick="nextStory(2)"></div>
  </div>
</div>

<script>
/* TYPE TEXT */
const text = "Will you be my Valentine? 💙";
let i=0;
const typeText=document.getElementById("typeText");
function type(){
  if(i<text.length){
    typeText.innerHTML+=text.charAt(i);
    i++;
    setTimeout(type,80);
  }
}
type();

/* VIDEO */
const bgMusic=document.getElementById("bgMusic");
const videoPlayer=document.getElementById("videoPlayer");

function playVideo(src){
  videoPlayer.src=src;
  videoPlayer.muted=false;
  videoPlayer.play();
  bgMusic.pause();
}

videoPlayer.onended=()=>bgMusic.play();

/* STORY LOGIC */
const stories1=["assets/story/1.jpg","assets/story/2.jpg","assets/story/3.jpg"];
const stories2=["assets/story/4.jpg","assets/story/5.jpg","assets/story/6.jpg"];

let index1=0,index2=0;
const dur=4000;

function setupProgress(id,count){
  const p=document.getElementById(id);
  for(let i=0;i<count;i++){
    const d=document.createElement("div");
    d.innerHTML="<span></span>";
    p.appendChild(d);
  }
}

setupProgress("prog1",stories1.length);
setupProgress("prog2",stories2.length);

function showStory(set){
  let img,arr,index;
  if(set===1){ img=story1; arr=stories1; index=index1;}
  else { img=story2; arr=stories2; index=index2;}

  img.src=arr[index];
  animateProgress(set,index);
}

function animateProgress(set,i){
  const spans=document.querySelectorAll(`#prog${set} span`);
  spans.forEach(s=>s.style.width="0%");
  let w=0;
  const interval=setInterval(()=>{
    if(w>=100) clearInterval(interval);
    else{
      w++;
      spans[i].style.width=w+"%";
    }
  },dur/100);
}

function nextStory(set){
  if(set===1){ index1=(index1+1)%stories1.length; showStory(1);}
  else{ index2=(index2+1)%stories2.length; showStory(2);}
}

function prevStory(set){
  if(set===1){ index1=(index1-1+stories1.length)%stories1.length; showStory(1);}
  else{ index2=(index2-1+stories2.length)%stories2.length; showStory(2);}
}

showStory(1);
showStory(2);

/* HEARTS */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.textContent="❤";
  h.style.left=Math.random()*100+"vw";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},900);
</script>

<script>
const envelope = document.getElementById("envelope");

setTimeout(() => {
  envelope.style.display = "none";
}, 2600); // must match animation duration
</script>


</body>
</html>
