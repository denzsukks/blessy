<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Valentine Story 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body {
  background: black;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* Progress bar */
.progress-container {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  gap: 5px;
  z-index: 10;
}

.progress {
  flex: 1;
  height: 4px;
  background: rgba(255,255,255,0.3);
  overflow: hidden;
  border-radius: 5px;
}

.progress span {
  display: block;
  height: 100%;
  width: 0%;
  background: white;
}

/* Story */
.story {
  width: 100vw;
  height: 100vh;
  position: relative;
}

.story img, .story video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Caption */
.caption {
  position: absolute;
  bottom: 60px;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 1.1rem;
  padding: 10px;
  background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
}

/* Tap areas */
.tap {
  position: absolute;
  top:0;
  bottom:0;
  width: 50%;
}

.tap.left { left:0; }
.tap.right { right:0; }

/* Floating hearts */
.heart {
  position: fixed;
  bottom: -20px;
  font-size: 20px;
  color: pink;
  animation: floatUp 5s linear infinite;
  opacity:0.8;
}

@keyframes floatUp {
  from { transform: translateY(0); opacity:1; }
  to { transform: translateY(-100vh); opacity:0; }
}
</style>
</head>

<body>

<!-- Background Music -->
<audio id="bg-music" autoplay loop>
  <source src="assets/img/kahel.mp3" type="audio/mpeg">
</audio>

<div class="progress-container" id="progressContainer"></div>

<div class="story" id="storyContainer"></div>

<div class="tap left" onclick="prevStory()"></div>
<div class="tap right" onclick="nextStory()"></div>

<script>
const stories = [
  { type: "image", src: "assets/story/1.jpg", caption: "Our first memory 💖" },
  { type: "image", src: "assets/story/2.jpg", caption: "You make me smile every day 😘" },
  { type: "video", src: "assets/story/3.mp4", caption: "My favorite moment with you 🎥" },
  { type: "image", src: "assets/story/4.jpg", caption: "Forever us ❤️" }
];

let current = 0;
let timer;
const duration = 5000; // 5 seconds per story

const storyContainer = document.getElementById("storyContainer");
const progressContainer = document.getElementById("progressContainer");

function setupProgress() {
  progressContainer.innerHTML = "";
  stories.forEach(() => {
    const bar = document.createElement("div");
    bar.classList.add("progress");
    bar.innerHTML = "<span></span>";
    progressContainer.appendChild(bar);
  });
}

function showStory(index) {
  clearInterval(timer);
  storyContainer.innerHTML = "";

  const story = stories[index];
  let element;

  if (story.type === "image") {
    element = document.createElement("img");
    element.src = story.src;
  } else {
    element = document.createElement("video");
    element.src = story.src;
    element.autoplay = true;
    element.muted = true;
    element.loop = false;
  }

  const caption = document.createElement("div");
  caption.className = "caption";
  caption.textContent = story.caption;

  storyContainer.appendChild(element);
  storyContainer.appendChild(caption);

  animateProgress(index);

  timer = setTimeout(nextStory, duration);
}

function animateProgress(index) {
  const bars = document.querySelectorAll(".progress span");
  bars.forEach(bar => bar.style.width = "0%");
  let width = 0;
  const interval = setInterval(() => {
    if (width >= 100) {
      clearInterval(interval);
    } else {
      width += 1;
      bars[index].style.width = width + "%";
    }
  }, duration / 100);
}

function nextStory() {
  current++;
  if (current >= stories.length) current = 0;
  showStory(current);
}

function prevStory() {
  current--;
  if (current < 0) current = stories.length - 1;
  showStory(current);
}

function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.textContent = "❤";
  heart.style.left = Math.random()*100+"vw";
  heart.style.animationDuration = (3+Math.random()*3)+"s";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),6000);
}

setInterval(createHeart, 600);

setupProgress();
showStory(current);
</script>

</body>
</html>
